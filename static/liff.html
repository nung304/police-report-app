<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ส่งรูปภาพเข้ากลุ่ม LINE</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 40px 20px; background: #f8fafc; color: #1e293b; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); display: inline-block; max-width: 420px; width: 100%; }
        .spinner { border: 4px solid #e2e8f0; border-top: 4px solid #06C755; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn { background-color: #06C755; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; display: none; width: 100%; }
        .btn:hover { background-color: #05b34c; }
        .error-box { color: #ef4444; background: #fef2f2; padding: 10px; border-radius: 8px; margin-top: 15px; font-size: 13px; word-break: break-all; text-align: left; }
    </style>
</head>
<body>
    <div class="card">
        <div id="loader" class="spinner"></div>
        <h3 id="status" style="margin-top:0;">กำลังเตรียมรูปภาพ...</h3>
        <p id="sub-status" style="color: #64748b; font-size: 14px; margin-bottom: 0;"></p>
        <button id="login-btn" class="btn" onclick="loginLINE()">🔑 เข้าสู่ระบบ LINE</button>
        <div id="error-detail" class="error-box" style="display:none;"></div>
    </div>

    <script>
        const LIFF_ID = "2011360956-IXDp4ofU";

        // ฟังก์ชันดึงค่า imgs จาก URL โดยใช้ Regex รองรับทั้ง direct URL และ liff.state
        function getImgsParam() {
            const fullUrl = window.location.href;
            
            // 1. ค้นหา ?imgs= หรือ &imgs= จาก URL โดยตรง
            const matchDirect = fullUrl.match(/[?&]imgs=([^&View#]+)/);
            if (matchDirect) return decodeURIComponent(matchDirect[1]);

            // 2. ค้นหาจาก liff.state กรณี LINE แปลง URL
            const matchState = fullUrl.match(/[?&]liff\.state=([^&View#]+)/);
            if (matchState) {
                const decodedState = decodeURIComponent(matchState[1]);
                const stateMatch = decodedState.match(/[?&]imgs=([^&View#]+)/);
                if (stateMatch) return decodeURIComponent(stateMatch[1]);
            }

            return null;
        }

        function loginLINE() {
            liff.login({ redirectUri: window.location.href });
        }

        async function main() {
            const statusEl = document.getElementById('status');
            const subStatusEl = document.getElementById('sub-status');
            const loaderEl = document.getElementById('loader');
            const loginBtn = document.getElementById('login-btn');
            const errorBox = document.getElementById('error-detail');

            try {
                // 1. ดึงข้อมูลรูปภาพ
                const rawImgs = getImgsParam();
                if (!rawImgs) {
                    statusEl.innerText = '❌ ไม่พบข้อมูลรูปภาพ';
                    subStatusEl.innerText = 'กรุณาเลือกรูปภาพในหน้า Streamlit แล้วกดปุ่มส่งใหม่อีกครั้ง';
                    loaderEl.style.display = 'none';
                    return;
                }

                // 2. เริ่มต้น LIFF
                statusEl.innerText = 'กำลังเชื่อมต่อกับ LINE...';
                await liff.init({ liffId: LIFF_ID });

                // 3. เช็กการเข้าสู่ระบบ (กรณีใช้บน PC)
                if (!liff.isLoggedIn()) {
                    statusEl.innerText = 'กรุณาเข้าสู่ระบบ LINE';
                    subStatusEl.innerText = 'เพื่อเลือกกลุ่มที่ต้องการส่งรูปภาพ';
                    loaderEl.style.display = 'none';
                    loginBtn.style.display = 'block';
                    return;
                }

                // 4. แปลงข้อมูล JSON รูปภาพ
                let imgUrls = JSON.parse(rawImgs);
                if (typeof imgUrls === 'string') imgUrls = [imgUrls];

                const messages = imgUrls.slice(0, 5).map(url => ({
                    type: 'image',
                    originalContentUrl: url,
                    previewImageUrl: url
                }));

                // 5. เปิดหน้าเลือกกลุ่ม LINE
                if (liff.isApiAvailable('shareTargetPicker')) {
                    statusEl.innerText = 'กำลังเปิดหน้าเลือกกลุ่ม LINE...';
                    subStatusEl.innerText = 'โปรดเลือกกลุ่มที่ต้องการส่งรูปภาพ';
                    
                    const res = await liff.shareTargetPicker(messages);
                    if (res) {
                        statusEl.innerText = '✅ ส่งรูปภาพเข้ากลุ่มสำเร็จ!';
                        subStatusEl.innerText = 'กำลังปิดหน้าต่างนี้...';
                        loaderEl.style.display = 'none';
                        setTimeout(() => { liff.closeWindow(); }, 1500);
                    } else {
                        statusEl.innerText = 'ยกเลิกการส่งรูปภาพ';
                        subStatusEl.innerText = 'ท่านกดปิดหน้าต่างเลือกกลุ่ม';
                        loaderEl.style.display = 'none';
                    }
                } else {
                    statusEl.innerText = '⚠️ ไม่สามารถเปิดหน้าเลือกกลุ่มได้';
                    subStatusEl.innerText = 'โปรดตรวจสอบสิทธิ์ Share Target Picker ใน LINE Console';
                    loaderEl.style.display = 'none';
                }
            } catch (err) {
                statusEl.innerText = 'เกิดข้อผิดพลาด';
                loaderEl.style.display = 'none';
                errorBox.style.display = 'block';
                errorBox.innerText = 'Error: ' + (err.message || String(err));
            }
        }

        window.onload = main;
    </script>
</body>
</html>
